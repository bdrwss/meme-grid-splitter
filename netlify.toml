[build]
  publish = "dist"
  command = "npm run build"

# 针对所有路由支持 SPA 重定向（如果刷新或直接访问子路径）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 对 ffmpeg 核心大型静态资源开启长期缓存，大幅提升二次访问与国内加载速度
[[headers]]
  for = "/ffmpeg/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
